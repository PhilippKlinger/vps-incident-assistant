# Manual eval run: all cases (or the ids in the input only) against every candidate model
# from evals/candidates.toml on Amazon Bedrock; a partial run cannot pass the report, missing
# cases count as unavailable. The bearer token and region come from the bedrock-evals
# environment. The report is an artifact; the controller commits it to the repository.
# Actions are pinned by commit SHA.
name: Evals

on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated case ids for a partial run (empty runs all cases)
        required: false
        default: ""
        type: string

# One full run at a time; a second dispatch waits instead of cancelling a running one.
concurrency:
  group: evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    name: Read candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.candidates.outputs.models }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: List candidate models
        id: candidates
        run: |
          set -Eeuo pipefail
          models="$(python -m evals candidates | python -c 'import json, sys; print(json.dumps([c["model"] for c in json.load(sys.stdin)["matrix"]]))')"
          echo "Models: ${models}"
          echo "models=${models}" >> "${GITHUB_OUTPUT}"

  run:
    name: Run ${{ matrix.model }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: bedrock-evals
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.matrix.outputs.models) }}
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      # Model IDs contain ":" which artifact names do not allow. Set before the run,
      # so the upload still finds the name when the run step is killed.
      - name: Name the result file
        id: name
        run: |
          set -Eeuo pipefail
          echo "slug=${MODEL//[^A-Za-z0-9._-]/-}" >> "${GITHUB_OUTPUT}"

      # The step limit stays below the job limit, so the upload below still runs.
      # The input only reaches the shell as an environment variable, never as a template.
      - name: Run cases
        timeout-minutes: 75
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
          SLUG: ${{ steps.name.outputs.slug }}
          ONLY: ${{ inputs.only }}
        run: |
          set -Eeuo pipefail
          only=()
          if [ -n "${ONLY}" ]; then
            only=(--only "${ONLY}")
          fi
          python -m evals run --model "${MODEL}" --out "run-${SLUG}.json" "${only[@]}"

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-${{ steps.name.outputs.slug }}
          path: run-${{ steps.name.outputs.slug }}.json
          if-no-files-found: warn

  report:
    name: Build report
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Download run results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: run-*
          path: runs
          merge-multiple: true

      - name: Build report
        run: |
          set -Eeuo pipefail
          ls runs
          python -m evals report --runs runs/run-*.json --out-dir eval-report
          cat eval-report/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: |
            eval-report/report.json
            eval-report/report.md
          if-no-files-found: error
