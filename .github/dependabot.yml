version: 2
updates:
  # Python dependencies from requirements.txt and requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 14 days before proposing a new release; security updates are not delayed.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Pinned action SHAs in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"

  # Base image in Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    # Python 3.13 is the chosen version; a newer one is a planned decision.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14"]
