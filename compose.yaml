# Incident assistant: Uptime Kuma (vps-monitoring) posts alerts over the network "incident",
# the assistant writes GitHub issues and Telegram messages, a local Ollama drafts the analysis.
# Starts only published images pinned by digest: no build, no source mounts, no published ports.
name: incident

# Same as the other stacks: journald deletes logs after 14 days (vps-edge host/journald-retention.conf)
x-logging: &logging
  driver: journald

services:
  assistant:
    # Pinned build from main; .env may override ASSISTANT_IMAGE (CI sets it to its own build or a placeholder digest).
    image: ${ASSISTANT_IMAGE:-ghcr.io/philippklinger/vps-incident-assistant@sha256:0cb00db1c0eedc96ea5b82468dfd66cb7b70fb053660bb1659385772000544d2}
    env_file: [.env]
    # The service writes nothing to disk; /tmp only for libraries that expect it
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # The image brings its own healthcheck (GET /healthz)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # No depends_on: the LLM is optional, the issue is written without it
    networks:
      incident:
        # Kuma's webhook URL: http://incident-assistant:8080/webhook/kuma
        aliases: [incident-assistant]
      llm:
      outbound:

  ollama:
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    # Not root: ./models belongs to UID 1000 (sudo install -d -o 1000 -g 1000 models)
    user: "1000:1000"
    environment:
      HOME: /models/home
      OLLAMA_MODELS: /models
      # Listen on the container network, otherwise only localhost inside the container
      OLLAMA_HOST: 0.0.0.0:11434
      # Shares the VPS with the other stacks: one model, one request, unloaded after 5 minutes
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # Bind mount instead of a named volume: a new named volume belongs to root
      - ./models:/models
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 8g
    # Lower CPU weight: Videoflix and the edge proxy win when the CPU is busy
    cpu_shares: 256
    restart: unless-stopped
    logging: *logging
    # Internal network only: no route to the internet, reachable only by the assistant
    networks: [llm]

  ollama-pull:
    # One-off download of the model: docker compose --profile setup run --rm ollama-pull
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    profiles: [setup]
    user: "1000:1000"
    environment:
      HOME: /models/home
      OLLAMA_MODELS: /models
    volumes:
      - ./models:/models
    # Starts a local server, waits until it answers, pulls the model and stops the server again
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!;
        until ollama list > /dev/null 2>&1; do kill -0 $$pid || exit 1; sleep 1; done;
        ollama pull "${OLLAMA_MODEL:-qwen3:8b}"; status=$$?;
        kill $$pid; exit $$status
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Same limits as ollama: the setup run shares the VPS as well
    cpus: 2
    mem_limit: 8g
    cpu_shares: 256
    logging: *logging
    # The download needs the internet, so this service is not in "llm"
    networks: [outbound]

networks:
  incident:
    # Created by vps-monitoring (internal, only Kuma and the assistant)
    name: incident
    external: true
  llm:
    # Assistant and Ollama only, no route to the outside
    internal: true
  outbound:
    # Route to GitHub and Telegram for the assistant, to the model registry for ollama-pull
    driver: bridge
