# Incident assistant: Uptime Kuma (vps-monitoring) posts alerts over the network "incident",
# the assistant writes GitHub issues and Telegram messages, Amazon Bedrock drafts the analysis.
# Starts only published images pinned by digest: no build, no source mounts, no published ports.
name: incident

# Same as the other stacks: journald deletes logs after 14 days (vps-edge host/journald-retention.conf)
x-logging: &logging
  driver: journald

services:
  assistant:
    # Pinned build from main; .env may override ASSISTANT_IMAGE (CI sets it to its own build or a placeholder digest).
    image: ${ASSISTANT_IMAGE:-ghcr.io/philippklinger/vps-incident-assistant@sha256:75f47f2a209f17d4266978302a1e1279668e74049cc891e5330ac570b16e3695}
    env_file: [.env]
    # The service writes nothing to disk; /tmp only for libraries that expect it
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # The image brings its own healthcheck (GET /healthz)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging: *logging
    # No depends_on: the analysis is optional, the issue is written without it
    networks:
      incident:
        # Kuma's webhook URL: http://incident-assistant:8080/webhook/kuma
        aliases: [incident-assistant]
      outbound:

networks:
  incident:
    # Created by vps-monitoring (internal, only Kuma and the assistant)
    name: incident
    external: true
  outbound:
    # Route to GitHub, Telegram and Amazon Bedrock for the assistant
    driver: bridge
