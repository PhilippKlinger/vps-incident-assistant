# Tool configuration only; the service is not built as a package.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns about httpx on import (third-party, not ours).
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
